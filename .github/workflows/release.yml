name: Publish Black God Linux Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: "🚀 Publish GitHub Release"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Download built ISO from previous run"
        uses: actions/download-artifact@v4
        with:
          name: black-god-linux-iso
          run-id: 34634159894
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "📦 Create GitHub Release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la
          ISO_FILE=$(find . -name "*.iso" -type f | head -1)
          SHA_FILE=$(find . -name "*.sha256" -type f | head -1)
          
          echo "Found ISO: $ISO_FILE"
          echo "Found SHA: $SHA_FILE"
          
          TAG="v1.0.0"
          
          cat << 'EOF' > release_notes.md
          ### ⚡ Black God Linux — Official ISO Release
          - **Base**: Kali Linux Rolling (Debian)
          - **Tools**: 300+ Pre-installed penetration testing tools
          - **Desktop**: Custom XFCE cyber theme & golden skull branding
          - **Commands**: blackgod-recon, blackgod-wifi, blackgod-update
          EOF
          
          gh release delete "$TAG" --yes 2>/dev/null || true
          
          gh release create "$TAG" \
            --title "⚡ Black God Linux $TAG" \
            --notes-file release_notes.md \
            "$ISO_FILE" "$SHA_FILE"
