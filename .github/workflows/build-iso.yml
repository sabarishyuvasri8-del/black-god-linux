# ═══════════════════════════════════════════════════════
#  BLACK GOD LINUX — GitHub Actions ISO Build Pipeline
#  Compiles the full Black God Linux ISO in the cloud
# ═══════════════════════════════════════════════════════

name: Build Black God Linux ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  build-iso:
    name: "⚡ Compile Black God Linux"
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 4 hour max
    
    container:
      image: kalilinux/kali-rolling
      options: --privileged

    steps:
      # ─── Checkout Repository ──────────────────────────
      - name: "📥 Checkout Black God Linux source"
        uses: actions/checkout@v4

      # ─── Install Build Dependencies ──────────────────
      - name: "📦 Install live-build & debootstrap"
        run: |
          apt-get update
          apt-get install -y live-build debootstrap wget gnupg2 curl cdebootstrap git

      # ─── Set File Permissions ────────────────────────
      - name: "🔧 Set executable permissions"
        run: |
          chmod +x auto/config auto/build auto/clean
          chmod +x kali-config/common/includes.chroot/usr/local/bin/blackgod-* || true
          chmod +x kali-config/common/includes.chroot/etc/update-motd.d/* || true

      # ─── Configure live-build ────────────────────────
      - name: "⚙️  Configure live-build"
        run: |
          lb config

      # ─── Build the ISO ───────────────────────────────
      - name: "🔨 Build Black God Linux ISO"
        run: |
          lb build 2>&1 | tee build.log
          echo ""
          echo "══════════════════════════════════════"
          ls -lh *.iso 2>/dev/null || echo "Checking for ISO in subdirectories..."
          find . -name "*.iso" -exec ls -lh {} \; 2>/dev/null
          echo "══════════════════════════════════════"

      # ─── Rename ISO ─────────────────────────────────
      - name: "🏷️  Rename ISO file"
        run: |
          ISO_FILE=$(find . -name "*.iso" -type f | head -1)
          if [ -n "$ISO_FILE" ]; then
            FINAL_NAME="black-god-linux-$(date +%Y%m%d)-amd64.iso"
            mv "$ISO_FILE" "$FINAL_NAME"
            echo "ISO_FILENAME=$FINAL_NAME" >> $GITHUB_ENV
            echo "✅ ISO built: $FINAL_NAME ($(du -h $FINAL_NAME | awk '{print $1}'))"
          else
            echo "❌ Build failed — no ISO produced"
            echo "Last 200 lines of build log:"
            tail -200 build.log
            exit 1
          fi

      # ─── Generate SHA256 Checksum ───────────────────
      - name: "🔒 Generate SHA256 checksum"
        run: |
          sha256sum "${{ env.ISO_FILENAME }}" > "${{ env.ISO_FILENAME }}.sha256"
          cat "${{ env.ISO_FILENAME }}.sha256"

      # ─── Upload ISO as Artifact ─────────────────────
      - name: "📤 Upload ISO artifact"
        uses: actions/upload-artifact@v4
        with:
          name: black-god-linux-iso
          path: |
            ${{ env.ISO_FILENAME }}
            ${{ env.ISO_FILENAME }}.sha256
          retention-days: 7
          compression-level: 0

      # ─── Upload Build Log ───────────────────────────
      - name: "📋 Upload build log"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
