name: Publish Black God Linux Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: "🚀 Publish GitHub Release"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "📥 Download built ISO from previous run"
        uses: actions/download-artifact@v4
        with:
          name: black-god-linux-iso
          run-id: 34634159894
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "📦 Create GitHub Release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la
          ISO_FILE=$(find . -name "*.iso" -type f | head -1)
          SHA_FILE=$(find . -name "*.sha256" -type f | head -1)
          echo "Found ISO: $ISO_FILE"
          echo "Found SHA: $SHA_FILE"
          TAG="v1.0.0"
          echo "### ⚡ Black God Linux — Official ISO Release" > release_notes.md
          echo "- Base: Kali Linux Rolling (Debian)" >> release_notes.md
          echo "- Tools: 300+ Pre-installed penetration testing tools" >> release_notes.md
          echo "- Desktop: Custom XFCE cyber theme & golden skull branding" >> release_notes.md
          echo "- Commands: blackgod-recon, blackgod-wifi, blackgod-update" >> release_notes.md
          gh release delete "$TAG" -R "${{ github.repository }}" --yes 2>/dev/null || true
          gh release create "$TAG" -R "${{ github.repository }}" --title "⚡ Black God Linux $TAG" --notes-file release_notes.md "$ISO_FILE" "$SHA_FILE"
