# ═══════════════════════════════════════════════════════
#  BLACK GOD LINUX — GitHub Actions ISO Build Pipeline
#  Compiles the full Black God Linux ISO in the cloud
# ═══════════════════════════════════════════════════════

name: Build Black God Linux ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  build-iso:
    name: "⚡ Compile Black God Linux"
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hour max

    steps:
      # ─── Checkout Repository ──────────────────────────
      - name: "📥 Checkout Black God Linux source"
        uses: actions/checkout@v4

      # ─── Free Up Disk Space ───────────────────────────
      - name: "🧹 Free up disk space on runner"
        run: |
          echo "── Before cleanup ──"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/share/swift /usr/local/.ghcup /usr/local/graalvm
          sudo docker image prune --all --force 2>/dev/null || true
          echo "── After cleanup ──"
          df -h /

      # ─── Install Build Dependencies ──────────────────
      - name: "📦 Install live-build & debootstrap"
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap wget gnupg2 curl

      # ─── Import Kali Archive Key ─────────────────────
      - name: "🔑 Import Kali Linux GPG keys"
        run: |
          sudo mkdir -p /usr/share/keyrings
          wget -q https://archive.kali.org/archive-key.asc -O- | sudo gpg --dearmor -o /usr/share/keyrings/kali-archive-keyring.gpg
          # Also add to apt trusted keys for debootstrap
          wget -q https://archive.kali.org/archive-key.asc -O- | sudo apt-key add - 2>/dev/null || true

      # ─── Set File Permissions ────────────────────────
      - name: "🔧 Set executable permissions"
        run: |
          chmod +x auto/config auto/build auto/clean
          chmod +x kali-config/common/includes.chroot/usr/local/bin/blackgod-* || true
          chmod +x kali-config/common/includes.chroot/etc/update-motd.d/* || true

      # ─── Configure live-build ────────────────────────
      - name: "⚙️  Configure live-build"
        run: |
          sudo lb config

      # ─── Build the ISO ───────────────────────────────
      - name: "🔨 Build Black God Linux ISO"
        run: |
          sudo lb build 2>&1 | tee build.log
          # Show build result
          echo ""
          echo "══════════════════════════════════════"
          ls -lh *.iso 2>/dev/null || echo "No ISO found, check build.log"
          echo "══════════════════════════════════════"

      # ─── Rename ISO ─────────────────────────────────
      - name: "🏷️  Rename ISO file"
        run: |
          ISO_FILE=$(ls *.iso 2>/dev/null | head -1)
          if [ -n "$ISO_FILE" ]; then
            FINAL_NAME="black-god-linux-$(date +%Y%m%d)-amd64.iso"
            sudo mv "$ISO_FILE" "$FINAL_NAME"
            echo "ISO_FILENAME=$FINAL_NAME" >> $GITHUB_ENV
            echo "✅ ISO built: $FINAL_NAME ($(du -h $FINAL_NAME | awk '{print $1}'))"
          else
            echo "❌ Build failed — no ISO produced"
            tail -100 build.log
            exit 1
          fi

      # ─── Generate SHA256 Checksum ───────────────────
      - name: "🔒 Generate SHA256 checksum"
        run: |
          sha256sum "${{ env.ISO_FILENAME }}" > "${{ env.ISO_FILENAME }}.sha256"
          cat "${{ env.ISO_FILENAME }}.sha256"

      # ─── Upload ISO as Artifact ─────────────────────
      - name: "📤 Upload ISO artifact"
        uses: actions/upload-artifact@v4
        with:
          name: black-god-linux-iso
          path: |
            ${{ env.ISO_FILENAME }}
            ${{ env.ISO_FILENAME }}.sha256
          retention-days: 7
          compression-level: 0  # ISO is already compressed (squashfs)

      # ─── Upload Build Log ───────────────────────────
      - name: "📋 Upload build log"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
